# GitHub Pages 배포: main 에 커밋이 들어오면 사이트를 빌드(npm run build)해서 결과(dist/)를 Pages 에 올립니다.
# 저장소 Settings → Pages → Source 가 'GitHub Actions' 여야 동작합니다.
# 검색 노출·분석 도구는 저장소 Settings → Secrets and variables → Actions → Variables 에서 켭니다(없으면 꺼진 상태).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 프로젝트 사이트 주소 https://amazingdove367.github.io/morh-website/ 에 맞춘 기준 경로
          BASE_PATH: /morh-website/
          PUBLIC_SITE_URL: https://amazingdove367.github.io
          # 기본값 false: 샘플 후기·미확정 정보가 있는 동안 검색 노출 차단
          PUBLIC_INDEXABLE: ${{ vars.PUBLIC_INDEXABLE || 'false' }}
          # GA4 측정 ID(MORH 웹 스트림). 운영 배포에서만 넣어 로컬 미리보기 방문이 통계에 섞이지 않게 함
          # 저장소 변수 PUBLIC_GA4_ID 가 있으면 그 값을 우선 사용
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID || 'G-D3ENJ9B8P7' }}
          # Google 태그 관리자 컨테이너 ID. GA4 와 같이 운영 배포에서만 넣음
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID || 'GTM-5DQWMNL6' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
